name: facade_analyzer
description: "Facade defect analysis, repair estimate and AI restoration."
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Networking & state
  dio: ^5.7.0
  dio_smart_retry: ^7.0.1
  pretty_dio_logger: ^1.4.0
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Photo capture & display
  image_picker: ^1.1.2
  photo_view: ^0.15.0
  cached_network_image: ^3.4.1

  # Utilities
  intl: ^0.20.2
  path_provider: ^2.1.5
  path: ^1.9.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.4
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.3
  http_mock_adapter: ^0.6.1

flutter:
  uses-material-design: true
